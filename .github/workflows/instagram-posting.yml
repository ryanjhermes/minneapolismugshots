name: Instagram Posting

on:
  schedule:
    # Hourly through the Central-time day (covers both CDT and CST). `data.py preflight`
    # acts only in Config.POSTING_HOURS slots and at Config.RECAP_HOUR; other runs exit in seconds.
    - cron: '7 0-3,12-23 * * *'
  workflow_dispatch: # Manual run posts the next inmate now (or the recap if the queue is done)

jobs:
  post-inmates:
    runs-on: ubuntu-latest
    # Shared with daily-scrape so the two never edit the queue at the same time
    concurrency:
      group: queue-state
      cancel-in-progress: false
    
    permissions:
      contents: write # Allow pushing updates to repository
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests python-dotenv pytz

    - name: Preflight (post, recap, or nothing)
      id: preflight
      run: python data.py preflight

    - name: Create .env file with secrets
      if: steps.preflight.outputs.mode != ''
      run: |
        echo "ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}" >> .env
        echo "APP_ID=${{ secrets.META_APP_ID }}" >> .env
        echo "BUSINESS_ID=${{ secrets.META_BUSINESS_ID }}" >> .env

    - name: Post Top 5 recap reel
      if: steps.preflight.outputs.mode == 'recap'
      run: python data.py post-recap

    - name: Post next inmates to Instagram
      if: steps.preflight.outputs.mode == 'post'
      run: |
        # Short randomization only when actually posting
        RANDOM_DELAY=$((RANDOM % 61))
        echo "🎲 Adding small random delay of $RANDOM_DELAY seconds"
        sleep $RANDOM_DELAY
        echo "📱 Posting next batch of inmates to Instagram..."
        python data.py post-next
        echo "✅ Posting batch completed"

    - name: Clean up posted mugshot files
      if: steps.preflight.outputs.mode == 'post'
      run: |
        echo "🗑️  Cleaning up ONLY posted inmates' mugshot files..."
        python data.py cleanup-posted
        echo "✅ Posted mugshot cleanup completed"

    - name: Commit queue updates
      if: steps.preflight.outputs.mode != ''
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if posting_queue.json was modified
        if git diff --quiet posting_queue.json; then
          echo "📭 No queue changes to commit"
        else
          git add posting_queue.json
          git commit -m "Update posting queue - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
          echo "✅ Queue updates committed"
        fi
        
        # Check if any mugshot files were deleted
        if git status --porcelain | grep -q "D.*mugshots/"; then
          echo "🗑️  Committing deleted mugshot files..."
          git add -A mugshots/
          git commit -m "Clean up posted mugshot files - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
          echo "✅ Mugshot cleanup committed"
        else
          echo "📭 No mugshot files to clean up"
        fi

    - name: Skip (nothing to do this hour)
      if: steps.preflight.outputs.mode == ''
      run: echo "⏭️  Skipping (reason=${{ steps.preflight.outputs.reason }})"
